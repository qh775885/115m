name: Release to Telegram

on:
  push:
    paths:
      - '.github/workflows/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag'
        required: false
        default: 'v1.9.4'
        type: string

jobs:
  notify:
    name: Notify Telegram
    runs-on: ubuntu-latest
    steps:
      - name: Send Notification and Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID"
            exit 1
          fi

          TAG="${INPUT_TAG:-}"
          if [ -z "$TAG" ]; then
            TAG="${EVENT_TAG:-}"
          fi
          if [ -z "$TAG" ]; then
            TAG="v1.9.4"
          fi
          export TAG

          echo "Fetching details for release tag: $TAG"
          gh release view "$TAG" --repo "${{ github.repository }}" --json name,body > /tmp/release.json

          python3 <<'PY' > /tmp/telegram_payload.json
          import json
          import os

          with open("/tmp/release.json", "r", encoding="utf-8") as f:
              rel = json.load(f)

          tag = os.environ.get("TAG", "")
          title = rel.get("name") or tag or "New release"
          body = (rel.get("body") or "").strip()
          if len(body) > 3800:
              body = body[:3800].rstrip() + "\n..."

          lines = [
              "🎉 115m 新版本发布",
              f"🏷 版本：{tag}",
              f"📌 标题：{title}",
          ]
          if body:
              lines.extend(["", body])

          payload = {
              "chat_id": os.environ["TELEGRAM_CHAT_ID"],
              "text": "\n".join(lines),
              "disable_web_page_preview": True,
          }
          print(json.dumps(payload, ensure_ascii=False))
          PY

          echo "Sending text notification to Telegram..."
          curl --fail --show-error --silent \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            --data @/tmp/telegram_payload.json

          echo "Downloading ZIP asset..."
          mkdir -p /tmp/release_assets
          gh release download "$TAG" --pattern "*.zip" --dir /tmp/release_assets --repo "${{ github.repository }}" || true

          ZIP_FILE=$(find /tmp/release_assets -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ] && [ -f "$ZIP_FILE" ]; then
            echo "Found ZIP asset: $ZIP_FILE, sending to Telegram..."
            CAPTION="📦 115m ${TAG} 安装包

👇 安装/更新指南：
1. 下载此压缩包，并【解压】到一个固定的文件夹中。
2. 浏览器地址栏输入 chrome://extensions/ 打开扩展中心。
3. 开启右上角的【开发者模式】。
4. 点击【加载已解压的扩展程序】，选择刚才解压的文件夹即可。

💡 提示：
- 更新时，下载新包解压并覆盖原文件夹，在扩展页点“刷新”即可。
- 安装后请勿删除解压的文件夹，否则扩展会失效。"

            curl --fail --show-error --silent \
              -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "document=@${ZIP_FILE}" \
              -F "caption=${CAPTION}"
            echo "Asset sent successfully."
          else
            echo "No zip asset found for release $TAG."
          fi
