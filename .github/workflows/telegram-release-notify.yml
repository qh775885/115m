name: Notify Telegram on Release

on:
  release:
    types: [published]

jobs:
  notify:
    name: Notify Telegram
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram message (Text)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Use toJson and jq to safely extract fields without causing parse errors when github.event.release is null
          GH_EVENT: ${{ toJson(github.event) }}
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID"
            exit 1
          fi

          export RELEASE_NAME=$(echo "$GH_EVENT" | jq -r '.release.name // "Telegram 通知测试"')
          export RELEASE_TAG=$(echo "$GH_EVENT" | jq -r '.release.tag_name // "manual-test"')
          export RELEASE_BODY=$(echo "$GH_EVENT" | jq -r '.release.body // "这是一条 GitHub Actions 手动触发的测试通知。"')

          python3 <<'PY' > /tmp/telegram_payload.json
          import json
          import os

          title = os.environ.get("RELEASE_NAME") or os.environ.get("RELEASE_TAG") or "New release"
          tag = os.environ.get("RELEASE_TAG") or ""
          body = (os.environ.get("RELEASE_BODY") or "").strip()
          if len(body) > 3800:
              body = body[:3800].rstrip() + "\n..."

          lines = [
              "🎉 115m 新版本发布",
              f"🏷 版本：{tag}",
              f"📌 标题：{title}",
          ]

          if body:
              lines.extend(["", body])

          payload = {
              "chat_id": os.environ["TELEGRAM_CHAT_ID"],
              "text": "\n".join(lines),
              "disable_web_page_preview": True,
          }

          print(json.dumps(payload, ensure_ascii=False))
          PY

          curl --fail --show-error --silent \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            --data @/tmp/telegram_payload.json

      - name: Download Release Asset (ZIP)
        id: download_asset
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_EVENT: ${{ toJson(github.event) }}
        run: |
          export RELEASE_TAG=$(echo "$GH_EVENT" | jq -r '.release.tag_name // empty')
          if [ -z "$RELEASE_TAG" ]; then
            echo "No release tag found. Skipping."
            exit 0
          fi
          
          mkdir -p release_assets
          # 下载所有以 .zip 结尾的附件
          gh release download "$RELEASE_TAG" --pattern "*.zip" --dir release_assets --repo ${{ github.repository }} || true
          
          # 找到下载的 zip 文件路径
          ZIP_FILE=$(find release_assets -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip file: $ZIP_FILE"
            echo "ZIP_FILE=$ZIP_FILE" >> $GITHUB_ENV
          else
            echo "No zip file found for this release."
          fi

      - name: Send Telegram Document (ZIP)
        if: ${{ env.ZIP_FILE != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_EVENT: ${{ toJson(github.event) }}
        run: |
          export RELEASE_TAG=$(echo "$GH_EVENT" | jq -r '.release.tag_name // empty')
          
          CAPTION="📦 115m ${RELEASE_TAG} 安装包

👇 安装/更新指南：
1. 下载此压缩包，并【解压】到一个固定的文件夹中。
2. 浏览器地址栏输入 chrome://extensions/ 打开扩展中心。
3. 开启右上角的【开发者模式】。
4. 点击【加载已解压的扩展程序】，选择刚才解压的文件夹即可。

💡 提示：
- 更新时，下载新包解压并覆盖原文件夹，在扩展页点“刷新”即可。
- 安装后请勿删除解压的文件夹，否则扩展会失效。"

          curl --fail --show-error --silent \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@${ZIP_FILE}" \
            -F "caption=${CAPTION}"
