name: Notify Telegram on Release

on:
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    name: Notify Telegram
    runs-on: ubuntu-latest

    steps:
      - name: Resolve Release Information
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            NAME="${{ github.event.release.name }}"
            BODY="${{ github.event.release.body }}"
          else
            # 手动触发时获取最新 release
            echo "Workflow triggered manually. Fetching latest release info..."
            LATEST_JSON=$(gh release view --repo "${{ github.repository }}" --json tagName,name,body)
            TAG=$(echo "$LATEST_JSON" | jq -r '.tagName')
            NAME=$(echo "$LATEST_JSON" | jq -r '.name // empty')
            BODY=$(echo "$LATEST_JSON" | jq -r '.body // empty')
          fi

          if [ -z "$NAME" ]; then
            NAME="$TAG"
          fi

          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "NAME=$NAME" >> $GITHUB_ENV
          
          # 将 body 保存至临时文件避免换行转义问题
          printf "%s" "$BODY" > /tmp/release_body.txt

      - name: Send Telegram message (Text)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID"
            exit 1
          fi

          python3 <<'PY' > /tmp/telegram_payload.json
          import json
          import os

          tag = os.environ.get("TAG", "")
          name = os.environ.get("NAME") or tag or "New release"
          
          body = ""
          if os.path.exists("/tmp/release_body.txt"):
              with open("/tmp/release_body.txt", "r", encoding="utf-8") as f:
                  body = f.read().strip()

          if len(body) > 3500:
              body = body[:3500].rstrip() + "\n..."

          lines = [
              "🎉 115m 新版本发布",
              f"🏷 版本：{tag}",
              f"📌 标题：{name}",
          ]

          if body:
              lines.extend(["", body])

          payload = {
              "chat_id": os.environ["TELEGRAM_CHAT_ID"],
              "text": "\n".join(lines),
              "disable_web_page_preview": True,
          }

          print(json.dumps(payload, ensure_ascii=False))
          PY

          curl --fail --show-error --silent \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            --data @/tmp/telegram_payload.json

      - name: Download and Send Release Asset (ZIP)
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          mkdir -p /tmp/release_assets
          gh release download "$TAG" --pattern "*.zip" --dir /tmp/release_assets --repo "${{ github.repository }}" || true

          ZIP_FILE=$(find /tmp/release_assets -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ] && [ -f "$ZIP_FILE" ]; then
            echo "Found zip file: $ZIP_FILE. Uploading to Telegram..."
            CAPTION="📦 115m ${TAG} 安装包

👇 安装/更新指南：
1. 下载此压缩包，并【解压】到一个固定的文件夹中。
2. 浏览器地址栏输入 chrome://extensions/ 打开扩展中心。
3. 开启右上角的【开发者模式】。
4. 点击【加载已解压的扩展程序】，选择刚才解压的文件夹即可。

💡 提示：
- 更新时，下载新包解压并覆盖原文件夹，在扩展页点“刷新”即可。
- 安装后请勿删除解压的文件夹，否则扩展会失效。"

            curl --fail --show-error --silent \
              -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "document=@${ZIP_FILE}" \
              -F "caption=${CAPTION}"
            echo "Document sent successfully."
          else
            echo "No zip file found for release $TAG. Skipped."
          fi
