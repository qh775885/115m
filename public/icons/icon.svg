<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 背景深邃渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- 播放箭头流光渐变 (极光蓝 -> 电光青 -> 柔紫) -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- 2.0 光芒微球渐变 -->
    <linearGradient id="glowDotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- 微光投影滤镜 -->
    <filter id="playGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#38bdf8" flood-opacity="0.38"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <filter id="dotGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- 外部圆角外壳 -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="6"/>

  <!-- 内部精致高光边线 -->
  <rect x="22" y="22" width="468" height="468" rx="106" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="2"/>

  <!-- 中心流光播放按键 -->
  <g filter="url(#playGlow)">
    <path d="M 206 166 C 196 160 184 167 184 179 L 184 333 C 184 345 196 352 206 346 L 344 269 C 354 263 354 251 344 245 Z" fill="url(#playGrad)"/>
  </g>

  <!-- 右上角 2.0 极光灵动微光小圆环/光点 -->
  <circle cx="366" cy="146" r="18" fill="url(#glowDotGrad)" filter="url(#dotGlow)"/>
</svg>
